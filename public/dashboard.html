<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin">
<title>Dashboard Admin</title>
<style>
  :root {
    --bg: #eef0ff;
    --card: rgba(255,255,255,.86);
    --text: #141829;
    --muted: #6b7290;
    --line: rgba(99,102,241,.12);
    --a1: #6366f1; --a2: #a855f7; --a3: #ec4899;
    --good: #059669; --bad: #dc2626; --warn: #d97706;
    --shadow: 0 10px 30px -12px rgba(79,70,229,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0c18;
      --card: rgba(22,26,46,.85);
      --text: #eceefe;
      --muted: #97a0c4;
      --line: rgba(129,140,248,.16);
      --good: #34d399; --bad: #f87171; --warn: #fbbf24;
      --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 500px at -10% -10%, rgba(168,85,247,.22), transparent 60%),
      radial-gradient(800px 500px at 110% 0%, rgba(99,102,241,.22), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(236,72,153,.14), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 18px 14px 40px; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
          background: linear-gradient(135deg, var(--a1), var(--a2), var(--a3)); box-shadow: var(--shadow); }
  .brand h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 12px;
         padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); }
  .btn:active { transform: scale(.97); }

  /* Hero */
  .hero {
    border-radius: 22px; padding: 22px; color: #fff; margin-bottom: 14px; box-shadow: var(--shadow);
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); position: relative; overflow: hidden;
  }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%;
                 background: rgba(255,255,255,.12); }
  .hero .k { font-size: 12.5px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; }
  .hero .v { font-size: 34px; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; }
  .hero .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .chip { background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 11px; font-weight: 600; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
  .stat .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }
  .stat .label { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .stat .value { font-size: 20px; font-weight: 800; margin-top: 3px; letter-spacing: -.01em; }
  .c1 { background: rgba(99,102,241,.16); }
  .c2 { background: rgba(168,85,247,.16); }
  .c3 { background: rgba(236,72,153,.16); }
  .c4 { background: rgba(16,185,129,.16); }
  .c5 { background: rgba(245,158,11,.16); }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow);
          backdrop-filter: blur(10px); margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
  .card-head h2 { font-size: 15px; margin: 0; font-weight: 800; }
  .pill { font-size: 11.5px; font-weight: 600; color: var(--a1); background: rgba(99,102,241,.12); border-radius: 999px; padding: 4px 11px; }

  /* Chart */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 200px; }
  .col { flex: 1; height: 100%; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; }
  .bar { width: 100%; min-height: 6px; border-radius: 10px 10px 5px 5px;
         background: linear-gradient(180deg, var(--a2), var(--a1)); transition: height .6s cubic-bezier(.2,.8,.2,1); }
  .col.today .bar { background: linear-gradient(180deg, var(--a3), var(--a2)); box-shadow: 0 8px 18px -6px rgba(236,72,153,.6); }
  .bv { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 6px; white-space: nowrap; }
  .bl { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .col.today .bl { color: var(--text); font-weight: 800; }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  td.num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(217,119,6,.15); color: var(--warn); }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 6px; }

  /* Skeleton */
  .skel { color: transparent !important; background: linear-gradient(90deg, rgba(128,128,160,.15) 25%, rgba(128,128,160,.05) 50%, rgba(128,128,160,.15) 75%);
          background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* Login */
  .login-wrap { min-height: 80vh; display: grid; place-items: center; }
  .login { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); text-align: center; backdrop-filter: blur(10px); }
  .login .logo { margin: 0 auto 14px; width: 60px; height: 60px; font-size: 28px; border-radius: 20px; }
  .login h1 { font-size: 19px; margin: 0; }
  .login p { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
  input { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(128,128,160,.08);
          color: var(--text); font-size: 15px; outline: none; }
  input:focus { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(99,102,241,.2); }
  .btn-primary { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font-size: 15px; font-weight: 700;
                 background: linear-gradient(135deg, var(--a1), var(--a2), var(--a3)); box-shadow: var(--shadow); }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }

  .hidden { display: none !important; }
  .footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  @media (max-width: 480px) {
    .hero .v { font-size: 28px; }
    .stat .value { font-size: 17px; }
    .chart { height: 170px; gap: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="login-wrap">
    <div class="login">
      <div class="logo">📊</div>
      <h1>Dashboard Admin</h1>
      <p>Masukkan password untuk melihat data toko.</p>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn-primary">Masuk</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hidden">
    <div class="top">
      <div class="brand">
        <div class="logo">📊</div>
        <div>
          <h1>Dashboard Admin</h1>
          <div class="sub" id="updated">Memuat data...</div>
        </div>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn">↻ Refresh</button>
        <button id="logoutBtn" class="btn">Keluar</button>
      </div>
    </div>

    <div class="hero">
      <div class="k">Omset hari ini</div>
      <div class="v skel" id="heroOmset">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
      <div class="meta">
        <span class="chip" id="heroOrder">-</span>
        <span class="chip" id="heroDiff">-</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="ic c4">💰</div><div class="label">Total omset</div><div class="value skel" id="sOmsetTotal">&nbsp;</div></div>
      <div class="stat"><div class="ic c2">🛒</div><div class="label">Total order</div><div class="value skel" id="sOrderTotal">&nbsp;</div></div>
      <div class="stat"><div class="ic c1">🗂️</div><div class="label">Set di katalog</div><div class="value skel" id="sKatalog">&nbsp;</div></div>
      <div class="stat"><div class="ic c5">⏳</div><div class="label">Pesanan pending</div><div class="value skel" id="sPending">&nbsp;</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Omset 7 hari terakhir</h2>
        <span class="pill">WIB</span>
      </div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Pesanan pending</h2>
        <span class="pill" id="pendingCount">-</span>
      </div>
      <div class="table-wrap" id="pendingWrap"></div>
    </div>

    <div class="footer">Data diambil langsung dari database bot.</div>
  </div>

</div>

<script>
const API = "/api/admin-data";
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
const rb = (n) => n >= 1000000 ? (n / 1000000).toFixed(1) + "jt" : n >= 1000 ? Math.round(n / 1000) + "rb" : String(n);

function showLogin(msg) {
  localStorage.removeItem("dashKey");
  $("dashView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginErr").textContent = msg || "";
}

function setText(id, text) {
  const el = $(id);
  el.classList.remove("skel");
  el.textContent = text;
}

async function load() {
  const key = localStorage.getItem("dashKey");
  if (!key) return showLogin();

  $("updated").textContent = "Memuat data...";
  let res;
  try {
    res = await fetch(API, { headers: { "x-dash-key": key }, cache: "no-store" });
  } catch {
    $("updated").textContent = "Gagal terhubung ke server.";
    return;
  }
  if (res.status === 401) return showLogin("Password salah.");
  if (!res.ok) {
    $("updated").textContent = "Gagal memuat data (" + res.status + ").";
    return;
  }

  const d = await res.json();
  $("loginView").classList.add("hidden");
  $("dashView").classList.remove("hidden");
  $("updated").textContent = "Diperbarui " + new Date(d.generated_at).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", dateStyle: "medium", timeStyle: "short" }) + " WIB";

  const s = d.summary;
  const yest = d.chart.length >= 2 ? d.chart[d.chart.length - 2].rupiah : 0;

  // Hero: omset hari ini + perbandingan dengan kemarin
  setText("heroOmset", rp(s.omset_today));
  setText("heroOrder", s.order_today + " order hari ini");
  let diffText;
  if (!yest) diffText = "Belum ada pembanding kemarin";
  else {
    const pct = Math.round(((s.omset_today - yest) / yest) * 100);
    diffText = (pct >= 0 ? "▲ " : "▼ ") + Math.abs(pct) + "% dari kemarin";
  }
  $("heroDiff").textContent = diffText;

  setText("sOmsetTotal", rp(s.omset_total));
  setText("sOrderTotal", s.order_total + " order");
  setText("sKatalog", s.katalog_count + " set");
  setText("sPending", s.pending_count + " pesanan");

  // Grafik batang
  const max = Math.max(1, ...d.chart.map((c) => c.rupiah));
  const todayKey = d.chart.length ? d.chart[d.chart.length - 1].day : "";
  const hasData = d.chart.some((c) => c.rupiah > 0);
  $("chart").innerHTML = hasData ? d.chart.map((c) => {
    const h = c.rupiah ? Math.max(6, Math.round((c.rupiah / max) * 100)) : 3;
    const label = c.day.slice(8, 10) + "/" + c.day.slice(5, 7);
    const isToday = c.day === todayKey ? " today" : "";
    return '<div class="col' + isToday + '">' +
      '<div class="bv">' + esc(c.rupiah ? rb(c.rupiah) : "0") + "</div>" +
      '<div class="bar-wrap"><div class="bar" style="height:' + h + '%" title="' +
        esc(rp(c.rupiah) + " • " + c.count + " order") + '"></div></div>' +
      '<div class="bl">' + esc(label) + "</div></div>";
  }).join("") : '<div class="empty" style="width:100%"><div class="big">📭</div>Belum ada omset dalam 7 hari terakhir.</div>';

  // Tabel pending
  $("pendingCount").textContent = d.pending.length + " pesanan";
  if (!d.pending.length) {
    $("pendingWrap").innerHTML = '<div class="empty"><div class="big">✅</div>Semua pesanan sudah beres. Tidak ada yang pending.</div>';
  } else {
    $("pendingWrap").innerHTML =
      '<table><thead><tr><th>ID</th><th>Pembeli</th><th>Set</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
      d.pending.map((p) =>
        "<tr><td>" + esc(p.id) + "</td><td>" + esc(p.buyer_name) + "</td><td>" + esc(p.item_nama) +
        '</td><td class="num">' + esc(rp(p.nominal)) + '</td><td><span class="tag">' + esc(p.status) + "</span></td></tr>"
      ).join("") + "</tbody></table>";
  }
}

$("loginBtn").onclick = () => {
  const pw = $("pw").value;
  if (!pw) return;
  localStorage.setItem("dashKey", pw);
  $("loginErr").textContent = "";
  load();
};
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("refreshBtn").onclick = load;
$("logoutBtn").onclick = () => showLogin();

load();
setInterval(() => {
  if (!document.hidden && !$("dashView").classList.contains("hidden")) load();
}, 60000);
</script>
</body>
</html>
