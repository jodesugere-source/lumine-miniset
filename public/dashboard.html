<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin">
<title>Dashboard Admin</title>
<style>
  :root {
    --bg: #f4f5fb;
    --card: #ffffff;
    --text: #161a2b;
    --muted: #6b7280;
    --line: #e7e9f3;
    --accent: #6366f1;
    --accent2: #a855f7;
    --good: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d14;
      --card: #141824;
      --text: #e9ecf6;
      --muted: #8b93a7;
      --line: #20263a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .header .sub { font-size: 12.5px; opacity: .85; margin-top: 3px; }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 0; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: rgba(255,255,255,.18); color: #fff; transition: background .15s;
  }
  .btn:hover { background: rgba(255,255,255,.28); }
  .btn:active { transform: scale(.98); }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .stat .icon {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    font-size: 18px; background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .stat .label { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .stat .value { font-size: 21px; font-weight: 700; margin-top: 3px; letter-spacing: -.01em; }
  .stat .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  /* Section card */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
  .card-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .pill {
    font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }

  /* Chart */
  .chart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 8px; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; }
  .bar {
    width: 100%; min-height: 4px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
    transition: height .5s cubic-bezier(.2,.8,.2,1);
  }
  .col.today .bar { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .bv { font-size: 11px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; }
  .bl { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .col.today .bl { color: var(--text); font-weight: 700; }

  /* Table */
  .table-wrap { overflow-x: auto; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
  th, td { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn);
  }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; font-size: 13.5px; }

  /* Skeleton */
  .skel { background: linear-gradient(90deg, var(--line) 25%, transparent 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* Login */
  .login-wrap { min-height: 80vh; display: grid; place-items: center; }
  .login {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px; box-shadow: var(--shadow); text-align: center;
  }
  .login .logo {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); font-size: 24px;
  }
  .login h1 { font-size: 18px; margin: 0; }
  .login p { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .btn-primary {
    width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 600;
  }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }

  .hidden { display: none !important; }
  .footer { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 8px; }

  @media (max-width: 480px) {
    .wrap { padding: 14px 12px 30px; }
    .stat .value { font-size: 18px; }
    .chart { height: 160px; gap: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView" class="login-wrap">
    <div class="login">
      <div class="logo">📊</div>
      <h1>Dashboard Admin</h1>
      <p>Masukkan password untuk melihat data toko.</p>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn-primary">Masuk</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" class="hidden">
    <div class="header">
      <div>
        <h1>📊 Dashboard Admin</h1>
        <div class="sub" id="updated">Memuat data...</div>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn">↻ Refresh</button>
        <button id="logoutBtn" class="btn">Keluar</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="icon">💰</div><div class="label">Omset hari ini</div><div class="value skel" id="sOmsetToday">&nbsp;</div><div class="hint" id="sOmsetDiff"></div></div>
      <div class="stat"><div class="icon">🧾</div><div class="label">Order hari ini</div><div class="value skel" id="sOrderToday">&nbsp;</div></div>
      <div class="stat"><div class="icon">📈</div><div class="label">Total omset</div><div class="value skel" id="sOmsetTotal">&nbsp;</div></div>
      <div class="stat"><div class="icon">🛒</div><div class="label">Total order</div><div class="value skel" id="sOrderTotal">&nbsp;</div></div>
      <div class="stat"><div class="icon">🗂️</div><div class="label">Set di katalog</div><div class="value skel" id="sKatalog">&nbsp;</div></div>
      <div class="stat"><div class="icon">⏳</div><div class="label">Pending</div><div class="value skel" id="sPending">&nbsp;</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Omset 7 hari terakhir</h2>
        <span class="pill">WIB</span>
      </div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Pesanan pending</h2>
        <span class="pill" id="pendingCount">-</span>
      </div>
      <div class="table-wrap" id="pendingWrap"></div>
    </div>

    <div class="footer">Data diambil langsung dari database bot.</div>
  </div>

</div>

<script>
const API = "/api/admin-data";
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
const rb = (n) => n >= 1000000 ? (n / 1000000).toFixed(1) + "jt" : n >= 1000 ? Math.round(n / 1000) + "rb" : String(n);

function showLogin(msg) {
  localStorage.removeItem("dashKey");
  $("dashView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginErr").textContent = msg || "";
}

function setStat(id, text) {
  const el = $(id);
  el.classList.remove("skel");
  el.textContent = text;
}

async function load() {
  const key = localStorage.getItem("dashKey");
  if (!key) return showLogin();

  $("updated").textContent = "Memuat data...";
  let res;
  try {
    res = await fetch(API, { headers: { "x-dash-key": key }, cache: "no-store" });
  } catch {
    $("updated").textContent = "Gagal terhubung ke server.";
    return;
  }
  if (res.status === 401) return showLogin("Password salah.");
  if (!res.ok) {
    $("updated").textContent = "Gagal memuat data (" + res.status + ").";
    return;
  }

  const d = await res.json();
  $("loginView").classList.add("hidden");
  $("dashView").classList.remove("hidden");
  $("updated").textContent = "Diperbarui " + new Date(d.generated_at).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", dateStyle: "medium", timeStyle: "short" }) + " WIB";

  const s = d.summary;
  setStat("sOmsetToday", rp(s.omset_today));
  // Bandingkan dengan kemarin (dari data 7 hari yang sudah ada)
  const yest = d.chart.length >= 2 ? d.chart[d.chart.length - 2].rupiah : 0;
  const diffEl = $("sOmsetDiff");
  if (!yest) {
    diffEl.textContent = "Kemarin belum ada omset";
  } else {
    const pct = Math.round(((s.omset_today - yest) / yest) * 100);
    const arrow = pct >= 0 ? "▲" : "▼";
    diffEl.style.color = pct >= 0 ? "var(--good)" : "var(--bad)";
    diffEl.textContent = arrow + " " + Math.abs(pct) + "% dari kemarin";
  }
  setStat("sOrderToday", s.order_today + " order");
  setStat("sOmsetTotal", rp(s.omset_total));
  setStat("sOrderTotal", s.order_total + " order");
  setStat("sKatalog", s.katalog_count + " set");
  setStat("sPending", s.pending_count + " pesanan");

  // Grafik batang
  const max = Math.max(1, ...d.chart.map((c) => c.rupiah));
  const todayKey = d.chart.length ? d.chart[d.chart.length - 1].day : "";
  $("chart").innerHTML = d.chart.map((c) => {
    const h = c.rupiah ? Math.max(4, Math.round((c.rupiah / max) * 100)) : 2;
    const label = c.day.slice(8, 10) + "/" + c.day.slice(5, 7);
    const isToday = c.day === todayKey ? " today" : "";
    return '<div class="col' + isToday + '">' +
      '<div class="bv">' + esc(c.rupiah ? rb(c.rupiah) : "0") + "</div>" +
      '<div class="bar-wrap"><div class="bar" style="height:' + h + '%" title="' +
        esc(rp(c.rupiah) + " • " + c.count + " order") + '"></div></div>' +
      '<div class="bl">' + esc(label) + "</div></div>";
  }).join("");

  // Tabel pending
  $("pendingCount").textContent = d.pending.length + " pesanan";
  if (!d.pending.length) {
    $("pendingWrap").innerHTML = '<div class="empty">✅ Tidak ada pesanan pending.</div>';
  } else {
    $("pendingWrap").innerHTML =
      '<table><thead><tr><th>ID</th><th>Pembeli</th><th>Set</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
      d.pending.map((p) =>
        "<tr><td>" + esc(p.id) + "</td><td>" + esc(p.buyer_name) + "</td><td>" + esc(p.item_nama) +
        '</td><td class="num">' + esc(rp(p.nominal)) + '</td><td><span class="tag">' + esc(p.status) + "</span></td></tr>"
      ).join("") + "</tbody></table>";
  }
}

$("loginBtn").onclick = () => {
  const pw = $("pw").value;
  if (!pw) return;
  localStorage.setItem("dashKey", pw);
  $("loginErr").textContent = "";
  load();
};
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("refreshBtn").onclick = load;
$("logoutBtn").onclick = () => showLogin();

load();
// Auto-refresh tiap 60 detik (hanya saat sudah login dan tab terlihat)
setInterval(() => {
  if (!document.hidden && !$("dashView").classList.contains("hidden")) load();
}, 60000);
</script>
</body>
</html>
